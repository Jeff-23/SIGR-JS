name: Backend certification

on:
  pull_request:
    paths:
      [
        "backend/**",
        "docker-compose.yml",
        ".github/workflows/backend-certification.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "backend/**",
        "docker-compose.yml",
        ".github/workflows/backend-certification.yml",
      ]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sigr
          POSTGRES_PASSWORD: sigr_ci_password
          POSTGRES_DB: sigr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sigr -d sigr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sigr:sigr_ci_password@localhost:5432/sigr_ci
      JWT_SECRET: ci-secret-only-not-for-production
      SEED_ADMIN_PASSWORD: ci-seed-password-only
      CORS_ORIGINS: http://localhost:5173
      SWAGGER_ENABLED: "true"
      METRICS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run certify:ci
      - name: Validate Compose
        working-directory: .
        run: docker compose config --quiet
        env:
          POSTGRES_USER: sigr
          POSTGRES_PASSWORD: compose_validation_only
          POSTGRES_DB: sigr
          JWT_SECRET: compose-validation-secret-32-characters
          CORS_ORIGINS: https://example.invalid
      - name: Certify container from blank database
        working-directory: .
        env:
          COMPOSE_PROJECT_NAME: sigr_certification
          POSTGRES_USER: sigr
          POSTGRES_PASSWORD: sigr_certification_password
          POSTGRES_DB: sigr_certification
          POSTGRES_PORT: "55437"
          BACKEND_PORT: "3017"
          JWT_SECRET: certification-secret-with-more-than-32-characters
          SEED_ADMIN_PASSWORD: certification-seed-password
          CORS_ORIGINS: https://example.invalid
          TRUST_PROXY: "false"
          THROTTLE_LIMIT: "1000"
        run: |
          docker compose up --build --detach --wait backend
          curl --fail --silent --show-error http://127.0.0.1:3017/health/live
          curl --fail --silent --show-error http://127.0.0.1:3017/health/ready
          node backend/scripts/pilot-load.mjs --url http://127.0.0.1:3017/health/ready --requests 100 --concurrency 10 --p95-ms 1000
      - name: Stop certification containers
        if: always()
        working-directory: .
        env:
          COMPOSE_PROJECT_NAME: sigr_certification
          POSTGRES_USER: sigr
          POSTGRES_PASSWORD: sigr_certification_password
          POSTGRES_DB: sigr_certification
          POSTGRES_PORT: "55437"
          BACKEND_PORT: "3017"
          JWT_SECRET: certification-secret-with-more-than-32-characters
          SEED_ADMIN_PASSWORD: certification-seed-password
          CORS_ORIGINS: https://example.invalid
          TRUST_PROXY: "false"
          THROTTLE_LIMIT: "1000"
        run: docker compose down --volumes --remove-orphans
