name: Frontend certification

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-certification.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-certification.yml"]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run certify
